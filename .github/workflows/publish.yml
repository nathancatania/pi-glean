---
name: Publish to npm

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - name: Fetch the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check the npm version
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm version: ${NPM_VERSION}"
          if ! node --eval 'const p = process.argv[1].split(".").map(Number)
          const ok = p[0] > 11 || (p[0] === 11 && p[1] >= 15)
          process.exit(ok ? 0 : 1)' "${NPM_VERSION}"
          then
            echo "Staged publishing needs npm 11.15.0 or later."
            echo "This runner has npm ${NPM_VERSION}."
            exit 1
          fi

      - name: Verify the version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "$RELEASE_TAG"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Stage the release on npm
        run: npm stage publish

      - name: Show the approval step
        run: |
          {
            echo "## Approve the staged release"
            echo ""
            echo "npm staged the new version."
            echo "A maintainer must approve the version with 2FA."
            echo "Open the Staged Packages tab on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
